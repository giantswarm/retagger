- image: cr.kagent.dev/kagent-dev/kagent/controller
  override_repo_name: kagent-controller
  semver: ">= v0.9.4"
- image: cr.kagent.dev/kagent-dev/kagent/ui
  override_repo_name: kagent-ui
  semver: ">= v0.9.4"
- image: cr.kagent.dev/kagent-dev/kagent/app
  override_repo_name: kagent-app
  semver: ">= v0.9.4"
- image: cr.kagent.dev/kagent-dev/kagent/skills-init
  override_repo_name: kagent-skills-init
  semver: ">= v0.9.4"
# golang-adk is the Go ADK runtime image used by declarative agents with runtime: go
# (the default since kagent 0.10.0). Since 0.10.0 the controller reads that image
# from the chart's controller.goAgentImage values (GO_IMAGE_REGISTRY/REPOSITORY/TAG
# in its ConfigMap); the giantswarm/kagent wrapper maps goAgentImage.repository to
# the bare "golang-adk" that this mirror publishes (before 0.10.0 the controller
# derived it by replacing the last path segment of agentImage.repository, which
# is why the destination name is bare and must stay so).
# Two entries: plain semver tags and the -full variants (used when git skills are present).
# See https://github.com/kagent-dev/kagent/issues/2018
# Source is ghcr.io: upstream stopped publishing golang-adk to cr.kagent.dev
# after 0.9.9 (the other kagent images still live there), which silently
# stalled this mirror while declarative go agents on kagent >= 0.9.10
# compose gsoci golang-adk:<controller version> and fail to pull.
- image: ghcr.io/kagent-dev/kagent/golang-adk
  override_repo_name: golang-adk
  semver: ">= v0.9.4"
- image: ghcr.io/kagent-dev/kagent/golang-adk
  override_repo_name: golang-adk
  tag_or_pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+-full$"
- image: ghcr.io/kagent-dev/doc2vec/mcp
  override_repo_name: kagent-doc2vec-mcp
  semver: ">= 1.1.14"
# kagent-tools is the upstream tool-server image used by the kagent chart's
# kagent-tools subchart. Mirrored so the chart can pull from gsoci and satisfy
# the restrict-image-registries Kyverno policy (see giantswarm/kagent helm/kagent).
- image: ghcr.io/kagent-dev/kagent/tools
  override_repo_name: kagent-tools
  semver: ">= 0.1.3"
