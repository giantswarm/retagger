- image: cr.agentgateway.dev/controller
  override_repo_name: agentgateway-controller
  semver: ">= v1.2.0"
- image: cr.agentgateway.dev/agentgateway
  override_repo_name: agentgateway
  semver: ">= v1.2.0"
# Data-plane proxy image for the kgateway-based agentgateway v2 control plane.
# kgateway v2.2.1's deployer pins the agentgateway proxy to the 0.x tag line
# (AgentgatewayDefaultTag, e.g. 0.12.0 in v2.2.1); these do not match the
# ">= v1.2.0" rule above. Mirror the 0.x data-plane tags so Giant Swarm clusters
# can pull the proxy from gsoci. See giantswarm/agentgateway (v2 migration).
- image: cr.agentgateway.dev/agentgateway
  override_repo_name: agentgateway
  semver: ">= 0.12.0 < 1.0.0"
# The Giant Swarm line of agentgateway (github.com/giantswarm/agentgateway-upstream,
# FORK.md): upstream release + carried patches, built and scanned there. Only its
# release tags (vX.Y.Z-gs.N) are mirrored, next to upstream's tags above, so the
# packaging chart giantswarm/agentgateway and the agent-platform connectivity
# chart can pin them from gsoci. Dev builds (v…-dev.giantswarm.…) stay in ghcr.
- image: ghcr.io/giantswarm/agentgateway-upstream/agentgateway
  override_repo_name: agentgateway
  filter: '^(v[0-9]+\.[0-9]+\.[0-9]+-gs\.[0-9]+)$'
  semver: ">= 1.5.1-0"
- image: ghcr.io/giantswarm/agentgateway-upstream/controller
  override_repo_name: agentgateway-controller
  filter: '^(v[0-9]+\.[0-9]+\.[0-9]+-gs\.[0-9]+)$'
  semver: ">= 1.5.1-0"
