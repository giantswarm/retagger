version: 2.1

parameters:
  sign-all:
    type: boolean
    default: false
    description: |
      Sign every tag the image files govern at gsoci (the skopeo YAML files and the renamed-images
      files), not only the tags this run copies: the one-off pass over tags mirrored before signing
      existed, and the repair of a run whose signing failed. Idempotent. Trigger a pipeline on main
      with this parameter set to true.

jobs:
  validate:
    machine:
      image: ubuntu-2204:2024.01.2
    steps:
      - checkout
      - run:
          name: Validate YAML
          command: |
            docker run --rm -it \
             -v $PWD:/workdir \
             -w /workdir \
             gsoci.azurecr.io/giantswarm/yamllint:1.37.1 \
             --config-file /workdir/.yamllint \
             images/*.yaml
      - persist_to_workspace:
          root: .
          paths:
            - "images/"

  validate-skopeo:
    docker:
      - image: gsoci.azurecr.io/giantswarm/skopeo:v1.19.0
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run skopeo YAML files through 'skopeo sync --dry-run' for validation
          command: |
            for file in images/skopeo-*.yaml; do
              # The target does not matter here, so we use the non-existing `dummy.example.com/namespace/`.
              echo "Checking $file:"
              skopeo sync --dry-run --src yaml $file --dest docker dummy.example.com/namespace/  2>&1 | tee -a dry-run.log
              echo ""
            done

            # Skopeo sync exits with code 0 even of there were errors.
            # So let's make sure this test fails if there were some.
            if grep -q "level=error" dry-run.log; then
                echo -e "\033[0;31mERRORS OCCURRED\033[0m"
                echo "Here is the gist only. Scroll up to see them in context."
                echo ""
                grep "level=error" dry-run.log
                exit 1
            fi

  build-and-push-docker:
    machine:
      image: ubuntu-2404:2024.11.1
    parameters:
      username:
        type: string
      password:
        type: string
      registry:
        type: string
      tag:
        type: string
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build container image
          command: |
            docker build -t "<<parameters.registry>>/giantswarm/retagger:<<parameters.tag>>" .
      - run:
          name: Authenticate to registry
          command: |
            docker login -u "<<parameters.username>>" -p "<<parameters.password>>" "<<parameters.registry>>"
      - run:
          name: Push container image
          command: |
            echo "Pushing tag '<<parameters.tag>>' to <<parameters.registry>>..."
            docker push "<<parameters.registry>>/giantswarm/retagger:<<parameters.tag>>"

  filter-skopeo-tags:
    docker:
      - image: gsoci.azurecr.io/giantswarm/retagger:${CIRCLE_TAG:-$CIRCLE_SHA1}
    resource_class: small
    shell: /bin/bash
    parameters:
      filepath:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: "Log in to registries: docker"
          command: |
            docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            docker login -u ${ACR_GSOCI_RETAGGER_USERNAME} -p ${ACR_GSOCI_RETAGGER_PASSWORD} gsoci.azurecr.io
            max_retry=5
            counter=1
            until docker login -u ${ALIYUN_USERNAME} -p ${ALIYUN_PASSWORD} giantswarm-registry.cn-shanghai.cr.aliyuncs.com
            do
                # Total potential wait is x * ((max_retry * (max_retry - 1)) / 2), where x is the constant in the expression
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: "Log in to registries: skopeo"
          command: |
            skopeo login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            skopeo login -u ${ACR_GSOCI_RETAGGER_USERNAME} -p ${ACR_GSOCI_RETAGGER_PASSWORD} gsoci.azurecr.io
            max_retry=5
            counter=1
            until skopeo login -u ${ALIYUN_USERNAME} -p ${ALIYUN_PASSWORD} giantswarm-registry.cn-shanghai.cr.aliyuncs.com
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: Filter tags in Skopeo YAML
          command: |
            retagger filter "<<parameters.filepath>>" 2> >(tee "<<parameters.filepath>>.filtered.errlog" >&2)
      - persist_to_workspace:
          root: .
          paths:
            - "<<parameters.filepath>>.filtered"
            - "<<parameters.filepath>>.filtered.errlog"

  retag-image-name:
    docker:
      - image: gsoci.azurecr.io/giantswarm/retagger:${CIRCLE_TAG:-$CIRCLE_SHA1}
    resource_class: small
    shell: /bin/bash
    parameters:
      username:
        type: string
      password:
        type: string
      registry:
        type: string
      image_name:
        type: string
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Log in to Docker registry
          command: |
            skopeo login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            max_retry=5
            counter=1
            until skopeo login -u "<<parameters.username>>" -p "<<parameters.password>>" "<<parameters.registry>>"
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: Retag images
          no_output_timeout: 1h
          command: |
            skopeo sync --all --keep-going --retry-times 3 --src docker --dest docker \
              "<<parameters.image_name>>" "<<parameters.registry>>/giantswarm" | tee /tmp/skopeo.log
      - store_artifacts:
          path: /tmp/skopeo.log
          destination: "<<parameters.registry>>-<<parameters.image_name>>.log"
      - run:
          name: Validate success
          command: |
            [[ -s <<parameters.image_name>>.errlog ]] || exit 0
            echo "Errors have been encountered on the \"filter-skopeo-tags\" job, what could lead to some images and tags not being processed correctly."
            echo "These errors could be to multiple reasons, e.g. connectivity problems, malfunctioning code, etc., for more details see the logs below.\n"
            echo "Note, one common source of problems is when a target repository, for the image being retagged, does not exists in a target registries, e.g. Aliyun.\n"
            cat  <<parameters.image_name>>.errlog
            exit 1

  retag-registry:
    docker:
      - image: gsoci.azurecr.io/giantswarm/retagger:${CIRCLE_TAG:-$CIRCLE_SHA1}
    resource_class: small
    shell: /bin/bash
    environment:
      # One `skopeo login` serves skopeo (REGISTRY_AUTH_FILE) and cosign (DOCKER_CONFIG):
      # the same file in the same format.
      DOCKER_CONFIG: /tmp/.registry-auth
      REGISTRY_AUTH_FILE: /tmp/.registry-auth/config.json
    parameters:
      username:
        type: string
      password:
        type: string
      registry:
        type: string
      images_file:
        type: string
      sign:
        type: boolean
        default: false
        description: |
          Sign the copied images at the registry with cosign keyless signing under this job's
          CircleCI OIDC identity (README, "Signed images"). Needs the `architect` context for the
          OIDC token.
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Log in to Docker registry
          command: |
            mkdir -p "${DOCKER_CONFIG}"
            skopeo login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            max_retry=5
            counter=1
            until skopeo login -u "<<parameters.username>>" -p "<<parameters.password>>" "<<parameters.registry>>"
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: Retag images
          no_output_timeout: 1h
          command: |
            # --digestfile records one line per image that landed in the registry,
            # "<digest> docker://<registry>/giantswarm/<name>:<tag>", and only for the copies
            # that succeeded. That record, not the images file, is what `mirror-to-aliyun`
            # reads: it copies on from this registry instead of pulling from upstream again.
            skopeo sync --all --keep-going --retry-times 3 --src yaml --dest docker \
              --digestfile "<<parameters.images_file>>.copied" \
              "<<parameters.images_file>>" "<<parameters.registry>>/giantswarm" | tee /tmp/skopeo.log
      - persist_to_workspace:
          root: .
          paths:
            - "<<parameters.images_file>>.copied"
      - store_artifacts:
          path: /tmp/skopeo.log
          destination: "<<parameters.registry>>-<<parameters.images_file>>.log"
      - when:
          condition: <<parameters.sign>>
          steps:
            - run:
                name: Sign copied images
                no_output_timeout: 1h
                command: |
                  set -o pipefail
                  images_file="<<parameters.images_file>>"
                  if [[ "<<pipeline.parameters.sign-all>>" == "true" ]]; then
                    # The unfiltered file: every tag it governs, not only this run's copies.
                    images_file="${images_file%.filtered}"
                  fi
                  retagger sign --registry "<<parameters.registry>>/giantswarm" "${images_file}" | tee /tmp/retagger-sign.log
            - store_artifacts:
                path: /tmp/retagger-sign.log
                destination: "<<parameters.registry>>-<<parameters.images_file>>-sign.log"

  # Reports the errors the `filter-skopeo-tags` jobs left in `<file>.filtered.errlog`, all of
  # them at once.
  #
  # This used to be the last step of every `retag-registry` run, which meant a filter error
  # failed the GSOCI job. Now when the Aliyun mirror requires that job, that would have stopped
  # the mirror over an error that has nothing to do with it, and stopped it entirely, where
  # before it merely turned the Aliyun job red after the images had been copied. So the check
  # lives in a job of its own and the whole picture is in one place instead of being split
  # across twenty-one job logs.
  validate-filter-errors:
    docker:
      - image: gsoci.azurecr.io/giantswarm/retagger:${CIRCLE_TAG:-$CIRCLE_SHA1}
    resource_class: small
    shell: /bin/bash
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Report the errors the filter jobs recorded
          command: |
            shopt -s nullglob

            failed=()
            for errlog in images/skopeo-*.yaml.filtered.errlog; do
              if [[ -s "${errlog}" ]]; then
                failed+=("${errlog}")
              fi
            done

            if [[ ${#failed[@]} -eq 0 ]]; then
              echo "The filter jobs recorded no errors."
              exit 0
            fi

            echo "Errors have been encountered on the \"filter-skopeo-tags\" jobs, what could lead to some images and tags not being processed correctly."
            echo "These errors could be to multiple reasons, e.g. connectivity problems, malfunctioning code, etc., for more details see the logs below."
            echo "Note, one common source of problems is when a target repository, for the image being retagged, does not exists in a target registries, e.g. Aliyun."
            for errlog in "${failed[@]}"; do
              echo ""
              echo "--- ${errlog} ---"
              cat "${errlog}"
            done
            exit 1

  # The Aliyun half of the mirror, run on the self-hosted CircleCI runner inside China that
  # `architect/sync-china-registry` uses (architect-orb#724).
  #
  # It does not sync the images file. It reads the `.copied` record that the GSOCI
  # `retag-registry` run of the same file left in the workspace and copies each of those
  # images on from GSOCI, which is why it requires that job.
  mirror-to-aliyun:
    docker:
      - image: giantswarm-registry.cn-shanghai.cr.aliyuncs.com/giantswarm/skopeo:v1.22.3
        entrypoint: ["/bin/bash"]
    resource_class: giantswarm/galaxy-runner
    shell: /bin/bash
    environment:
      SOURCE_REGISTRY: gsoci.azurecr.io
      TARGET_REGISTRY: giantswarm-registry.cn-shanghai.cr.aliyuncs.com
    parameters:
      images_file:
        type: string
      replica_wait_minutes:
        type: integer
        default: 1
        description: |
          How long to wait for an image to become visible from this runner before giving up on
          it. GSOCI is a geo-replicated Azure Container Registry behind Traffic Manager.

          A minute to start with, because replication is usually quick. Raise it for a file
          whose images are repeatedly reported as not yet visible - a big image takes longer,
          and nothing downstream depends on this job, so a generous bound only costs runner
          time. An image that misses the bound is reported and picked up by the next run, which
          still sees it missing from Aliyun.
      dry_run:
        type: boolean
        default: false
        description: |
          Print what would be copied and copy nothing. `skopeo copy` has no dry-run of its
          own, so this skips the command rather than passing a flag to it. Everything around
          it still runs for real: the job is scheduled on the runner, pulls its image from
          Aliyun, logs in to both registries and reads the record from the workspace.
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Log in to registries
          command: |
            skopeo login -u ${ACR_GSOCI_RETAGGER_USERNAME} -p ${ACR_GSOCI_RETAGGER_PASSWORD} ${SOURCE_REGISTRY}
            max_retry=5
            counter=1
            until skopeo login -u ${ALIYUN_USERNAME} -p ${ALIYUN_PASSWORD} ${TARGET_REGISTRY}
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: Copy the images gsoci received on to Aliyun
          no_output_timeout: 1h
          command: |
            # One record for a skopeo file, which one `retag-gsoci` job syncs whole and
            # `skopeo sync --digestfile` records; several for a renamed-images file, whose
            # rules are split across five `retag-renamed-images` executors that each record
            # their own share.
            shopt -s nullglob
            records=( "<<parameters.images_file>>"*.copied )
            if [[ ${#records[@]} -eq 0 ]]; then
              echo "No <<parameters.images_file>>*.copied in the workspace. The gsoci job writes the record; see its log."
              exit 1
            fi
            echo "Reading ${#records[@]} record(s): ${records[*]}"
            cat "${records[@]}" > /tmp/record

            # visible tells whether every manifest under a reference can be read from this
            # runner. An index is served by the replica before the platform manifests it points
            # at, so checking the tag alone is not enough: this walks the children, and their
            # children, since an index can nest. A manifest only appears once its layers are
            # across, so a readable manifest tree means the image is wholly here.
            visible() {
              local ref="$1" repo="$2" raw digest
              raw=$(skopeo inspect --raw "${ref}" 2>/dev/null) || return 1
              # Not an index: the manifest itself is here, and there is nothing under it to
              # check. Only an index carries child digests; a plain manifest's digests are its
              # config and layers, which are blobs rather than manifests.
              # Piped rather than fed by a bash here-string: CircleCI reads a doubled angle
              # bracket as the start of one of its own tags and rejects the config as an
              # unclosed tag.
              printf '%s' "${raw}" | grep -qE 'image\.index|manifest\.list' || return 0
              for digest in $(printf '%s' "${raw}" | grep -oE 'sha256:[0-9a-f]{64}' | sort -u); do
                visible "${repo}@${digest}" "${repo}" || return 1
              done
            }

            # waitForReplica polls until the source is wholly visible, or the bound runs out.
            waitForReplica() {
              local ref="$1" repo="$2" deadline=$(( SECONDS + <<parameters.replica_wait_minutes>> * 60 ))
              while true; do
                if visible "${ref}" "${repo}"; then
                  return 0
                fi
                if [[ ${SECONDS} -ge ${deadline} ]]; then
                  echo "Gave up after <<parameters.replica_wait_minutes>> minutes: ${ref} has not fully replicated to this runner."
                  return 1
                fi
                echo "Not fully replicated here yet, waiting 20s: ${ref}"
                sleep 20
              done
            }

            rm -f /tmp/failed
            {
              if [[ "<<parameters.dry_run>>" == "true" ]]; then
                echo "DRY RUN: listing the copies only, nothing is written to ${TARGET_REGISTRY}."
              fi
              echo "Copying $(grep -c . /tmp/record) image(s) from ${SOURCE_REGISTRY} to ${TARGET_REGISTRY}"
              while read -r line; do
                if [[ -z "${line}" ]]; then
                  continue
                fi
                # 'skopeo sync --digestfile' writes "<digest> <reference>", 'retagger run'
                # writes just the reference; the last field reads either.
                source="${line##* }"
                # "docker://gsoci.azurecr.io/giantswarm/alpine:3.18" -> "giantswarm/alpine:3.18".
                # Both registries hold the image under the same name -- 'skopeo sync' flattens
                # the repository path to its last element, and a renamed-images rule names the
                # one destination repository -- so only the host changes here.
                image="${source#docker://${SOURCE_REGISTRY}/}"
                destination="docker://${TARGET_REGISTRY}/${image}"
                echo ""
                if [[ "<<parameters.dry_run>>" == "true" ]]; then
                  echo "Would copy: skopeo copy --all --retry-times 3 ${source} ${destination}"
                  continue
                fi
                if ! waitForReplica "${source}" "${source%:*}"; then
                  echo "${image}" >> /tmp/failed
                  continue
                fi
                echo "Copying ${source} to ${destination}"
                if ! skopeo copy --all --retry-times 3 "${source}" "${destination}"; then
                  echo "Failed to copy ${source} to ${destination}"
                  echo "${image}" >> /tmp/failed
                fi
              done < /tmp/record
            } 2>&1 | tee /tmp/skopeo.log
      - store_artifacts:
          path: /tmp/skopeo.log
          destination: "aliyun-<<parameters.images_file>>.log"
      - run:
          name: Validate success
          command: |
            # Like 'skopeo sync --keep-going': one image that cannot be copied does not stop
            # the rest, but the job still reports it.
            [[ -s /tmp/failed ]] || exit 0
            echo "Failed to copy the following images to ${TARGET_REGISTRY}:"
            cat /tmp/failed
            echo ""
            echo "Note, one common source of problems is when a target repository, for the image being retagged, does not exists in a target registries, e.g. Aliyun."
            echo "The other is an image still replicating to the ${SOURCE_REGISTRY} replica this runner reads; the step above says so ('has not fully replicated') and a rerun picks it up."
            exit 1

  retag-renamed-images:
    docker:
      - image: gsoci.azurecr.io/giantswarm/retagger:${CIRCLE_TAG:-$CIRCLE_SHA1}
    resource_class: small
    shell: /bin/bash
    parameters:
      log_level:
        type: string
        default: "debug"
      executor_count:
        type: integer
        default: 1
      executor_id:
        type: integer
        default: 0
      filename:
        type: string
      sign:
        type: boolean
        default: false
        description: |
          Sign every tag copied to gsoci right after its copy, with cosign keyless signing under
          this job's CircleCI OIDC identity (README, "Signed images"); with the pipeline parameter
          `sign-all`, also every tag this executor's share of the file governs. Needs the
          `architect` context for the OIDC token. cosign reads the registry credentials
          `docker login` stores.
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: .
      - run:
          name: "Log in to registries: docker"
          command: |
            docker login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            docker login -u ${ACR_GSOCI_RETAGGER_USERNAME} -p ${ACR_GSOCI_RETAGGER_PASSWORD} gsoci.azurecr.io
            max_retry=5
            counter=1
            until docker login -u ${ALIYUN_USERNAME} -p ${ALIYUN_PASSWORD} giantswarm-registry.cn-shanghai.cr.aliyuncs.com
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: "Log in to registries: skopeo"
          command: |
            skopeo login -u ${DOCKER_USERNAME} -p ${DOCKER_PASSWORD} docker.io
            skopeo login -u ${ACR_GSOCI_RETAGGER_USERNAME} -p ${ACR_GSOCI_RETAGGER_PASSWORD} gsoci.azurecr.io
            max_retry=5
            counter=1
            until skopeo login -u ${ALIYUN_USERNAME} -p ${ALIYUN_PASSWORD} giantswarm-registry.cn-shanghai.cr.aliyuncs.com
            do
                sleep $((10 * $counter))
                [[ counter -eq $max_retry ]] && echo "Failed by exhausting $max_retry retries" && exit 1
                echo "Attempt $counter: trying again..."
                ((counter++))
            done
      - run:
          name: "Run retagger"
          no_output_timeout: 1h
          command: |
            set -o pipefail
            retagger run --log-level "<<parameters.log_level>>" --sign=<<parameters.sign>> \
              --executor-count <<parameters.executor_count>> --executor-id <<parameters.executor_id>> --filename <<parameters.filename>> | tee /tmp/retagger.log
      # `retagger run` writes one reference per line, every tag this executor copied to gsoci.
      # The Aliyun mirror reads the records of all the executors of this file and copies them
      # on from gsoci, the same way it does for the skopeo files' `--digestfile` records.
      - persist_to_workspace:
          root: .
          paths:
            - "<<parameters.filename>>.<<parameters.executor_id>>.copied"
      - store_artifacts:
          path: /tmp/retagger.log
          destination: "retagger-<<parameters.filename>>-<<parameters.executor_id>>-of-<<parameters.executor_count>>.log"
      - when:
          condition:
            and:
              - <<parameters.sign>>
              - <<pipeline.parameters.sign-all>>
          steps:
            - run:
                name: Sign every governed image
                no_output_timeout: 1h
                command: |
                  # One worker: forty of these jobs share the registry's per-identity referrers rate limit.
                  set -o pipefail
                  retagger sign --sign-workers 1 \
                    --executor-count <<parameters.executor_count>> --executor-id <<parameters.executor_id>> <<parameters.filename>> | tee /tmp/retagger-sign.log
            - store_artifacts:
                path: /tmp/retagger-sign.log
                destination: "retagger-<<parameters.filename>>-<<parameters.executor_id>>-of-<<parameters.executor_count>>-sign.log"

  ping-heartbeat:
    docker:
      - image: curlimages/curl:latest
    steps:
      - run:
          name: Ping heartbeat
          environment:
            HEARTBEAT_NAME: retagger-cronjob
          command: |
            curl -X GET https://api.opsgenie.com/v2/heartbeats/$HEARTBEAT_NAME/ping --header "Authorization: GenieKey ${OPSGENIE_HEARTBEAT_KEY}"

# Define 'trivy_databases' workflow so we can reuse it.
trivy_databases: &trivy_databases
  jobs:
    - build-and-push-docker:
        context: architect
        name: build-and-push-docker
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        tag: ${CIRCLE_TAG:-$CIRCLE_SHA1}
    - retag-image-name:
        context: architect
        name: retag-gsoci-trivy-database
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        image_name: "mirror.gcr.io/aquasec/trivy-db"
        requires:
          - build-and-push-docker
    - retag-image-name:
        context: architect
        name: retag-gsoci-trivy-java-database
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        image_name: "mirror.gcr.io/aquasec/trivy-java-db"
        requires:
          - build-and-push-docker
    - retag-image-name:
        context: architect
        name: retag-gsoci-trivy-checks
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        image_name: "mirror.gcr.io/aquasec/trivy-checks"
        requires:
          - build-and-push-docker
    - retag-image-name:
        context: architect
        name: retag-aliyun-trivy-database
        username: ${ALIYUN_USERNAME}
        password: ${ALIYUN_PASSWORD}
        registry: "giantswarm-registry.cn-shanghai.cr.aliyuncs.com"
        image_name: "mirror.gcr.io/aquasec/trivy-db"
        requires:
          - build-and-push-docker
    - retag-image-name:
        context: architect
        name: retag-aliyun-trivy-java-database
        username: ${ALIYUN_USERNAME}
        password: ${ALIYUN_PASSWORD}
        registry: "giantswarm-registry.cn-shanghai.cr.aliyuncs.com"
        image_name: "mirror.gcr.io/aquasec/trivy-java-db"
        requires:
          - build-and-push-docker

# TODO: drop `use-china-runners-for-aliyun` before merging. It is here to exercise the new
# `mirror-to-aliyun` job on the China runner, which cannot be reached from a branch otherwise.
retag_branches: &retag_branches
  branches:
    only:
      - main
      - use-china-runners-for-aliyun

# The renamed-images files, shared by the jobs that copy them to gsoci and the jobs that mirror
# those copies on to Aliyun, so a new file is added in one place.
renamed_images_files: &renamed_images_files
              - images/renamed-images.yaml
              - images/renamed-agentgateway.yaml
              - images/renamed-agent-sandbox.yaml
              - images/renamed-kagent.yaml
              - images/renamed-cilium-prereleases.yaml
              - images/renamed-upbound-aws.yaml
              - images/renamed-upbound-azure.yaml
              - images/renamed-upbound-gcp.yaml

# Define 'build_and_retag' workflow steps, so we can reuse it.
build_and_retag: &build_and_retag
  jobs:
    - validate:
        name: validate-images-yaml
    - validate-skopeo:
        name: validate-skopeo
        requires:
          - validate-images-yaml
    - build-and-push-docker:
        context: architect
        name: build-and-push-docker
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        tag: ${CIRCLE_TAG:-$CIRCLE_SHA1}
        requires:
          - validate-skopeo
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-docker-io
        filepath: images/skopeo-docker-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-eu-gcr-io
        filepath: images/skopeo-eu-gcr-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-gcr-io
        filepath: images/skopeo-gcr-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-ghcr-io
        filepath: images/skopeo-ghcr-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-mcr-microsoft-com
        filepath: images/skopeo-mcr-microsoft-com.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-nvcr-io
        filepath: images/skopeo-nvcr-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-public-ecr-aws
        filepath: images/skopeo-public-ecr-aws.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-quay-io
        filepath: images/skopeo-quay-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-k8s-io
        filepath: images/skopeo-registry-k8s-io.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-k8s-io-kubernetes
        filepath: images/skopeo-registry-k8s-io-kubernetes.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - filter-skopeo-tags:
        context: architect
        name: filter-skopeo-projects-registry-vmware-com
        filepath: images/skopeo-projects-registry-vmware-com.yaml
        filters: *retag_branches
        requires:
          - build-and-push-docker
    - validate-filter-errors:
        context: architect
        name: validate-filter-errors
        requires:
          - filter-skopeo-docker-io
          - filter-skopeo-eu-gcr-io
          - filter-skopeo-gcr-io
          - filter-skopeo-ghcr-io
          - filter-skopeo-mcr-microsoft-com
          - filter-skopeo-nvcr-io
          - filter-skopeo-public-ecr-aws
          - filter-skopeo-quay-io
          - filter-skopeo-k8s-io
          - filter-skopeo-k8s-io-kubernetes
          - filter-skopeo-projects-registry-vmware-com
    - retag-registry:
        context: architect
        name: retag-gsoci-<<matrix.images_file>>
        username: ${ACR_GSOCI_RETAGGER_USERNAME}
        password: ${ACR_GSOCI_RETAGGER_PASSWORD}
        registry: "gsoci.azurecr.io"
        sign: true
        requires:
          - filter-skopeo-docker-io
          - filter-skopeo-eu-gcr-io
          - filter-skopeo-gcr-io
          - filter-skopeo-ghcr-io
          - filter-skopeo-mcr-microsoft-com
          - filter-skopeo-nvcr-io
          - filter-skopeo-public-ecr-aws
          - filter-skopeo-quay-io
          - filter-skopeo-k8s-io
          - filter-skopeo-k8s-io-kubernetes
          - filter-skopeo-projects-registry-vmware-com
        matrix:
          # Named so the Aliyun mirror can require the whole matrix rather than each of its
          # instances -- see `retag-renamed-images` for why that matters.
          alias: retag-gsoci
          parameters:
            images_file:
              - images/skopeo-docker-io.yaml.filtered
              - images/skopeo-eu-gcr-io.yaml.filtered
              - images/skopeo-gcr-io.yaml.filtered
              - images/skopeo-ghcr-io.yaml.filtered
              - images/skopeo-mcr-microsoft-com.yaml.filtered
              - images/skopeo-nvcr-io.yaml.filtered
              - images/skopeo-public-ecr-aws.yaml.filtered
              - images/skopeo-quay-io.yaml.filtered
              - images/skopeo-registry-k8s-io.yaml.filtered
              - images/skopeo-registry-k8s-io-kubernetes.yaml.filtered
              - images/skopeo-projects-registry-vmware-com.yaml.filtered
    # Reads what the gsoci jobs recorded, so it waits for all of them rather than for the
    # filter jobs. CircleCI cannot express a per-matrix-instance dependency, hence the full
    # list: every Aliyun copy waits for every gsoci copy, not just for its own file.
    - mirror-to-aliyun:
        context: architect
        name: retag-aliyun-<<matrix.images_file>>
        requires:
          - retag-gsoci
        matrix:
          parameters:
            images_file:
              - images/skopeo-docker-io.yaml.filtered
              - images/skopeo-eu-gcr-io.yaml.filtered
              - images/skopeo-gcr-io.yaml.filtered
              - images/skopeo-ghcr-io.yaml.filtered
              - images/skopeo-mcr-microsoft-com.yaml.filtered
              - images/skopeo-nvcr-io.yaml.filtered
              - images/skopeo-public-ecr-aws.yaml.filtered
              - images/skopeo-quay-io.yaml.filtered
              - images/skopeo-registry-k8s-io.yaml.filtered
              - images/skopeo-registry-k8s-io-kubernetes.yaml.filtered
    - retag-renamed-images:
        context: architect
        name: retag-renamed-images-<<matrix.filename>>-<<matrix.executor_id>>
        requires:
          - build-and-push-docker
        executor_count: 5
        sign: true
        filters: *retag_branches
        matrix:
          # Named so the Aliyun mirror can require the whole matrix with one entry. Listing the
          # instances instead would have to be rewritten every time `executor_count` changes,
          # and forgetting to would leave the mirror reading a half-written set of records.
          alias: retag-renamed-images
          parameters:
            filename: *renamed_images_files
            # i in range(executor_count)
            executor_id: [0, 1, 2, 3, 4]

    # The Aliyun half of the renamed-images mirror. Same job as for the skopeo files: it reads
    # the records the gsoci copies left in the workspace and copies those references on from
    # gsoci, on the runner inside China. A renamed-images file is split across five executors,
    # so it has five records; the job globs them.
    #
    # CircleCI cannot express a per-matrix-instance dependency, so every mirror waits for every
    # `retag-renamed-images` job rather than just for the five that share its file.
    - mirror-to-aliyun:
        context: architect
        name: retag-aliyun-<<matrix.images_file>>
        requires:
          - retag-renamed-images
        filters: *retag_branches
        matrix:
          parameters:
            images_file: *renamed_images_files

    - ping-heartbeat:
        name: ping-heartbeat
        # Ideally we would wait for the end of the workflow. But we don't know what the last job is, since it's a matrix executed in parallel.
        # So this is better than nothing.
        requires:
          - filter-skopeo-k8s-io-kubernetes
        # Stays on main. It used to inherit main-only from its dependency; now that the chain
        # also runs from a test branch, a branch run would ping the cronjob heartbeat and hide
        # a nightly run that never happened.
        filters:
          branches:
            only:
              - main

workflows:
  build_retag:
    <<: *build_and_retag

  # Runs nightly at 21:38 UTC
  build_retag_nightly:
    triggers:
      - schedule:
          cron: "38 21 * * *"
          filters:
            branches:
              only: main
    <<: *build_and_retag

  # Runs every 12 hours at 09:08 and 21:08 UTC
  trivy_databases:
    triggers:
      - schedule:
          cron: "08 09,21 * * *"
          filters:
            branches:
              only: main
    <<: *trivy_databases
